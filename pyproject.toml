# ---------------------------------------------------------------------------
# Tooling configuration for AI Ticket Analyzer (Milestone M0.1).
#
# Only static-analysis / coverage tooling is configured here. Runtime test
# discovery remains in pytest.ini to avoid duplicate/competing configuration.
# No application behavior is affected by this file.
# ---------------------------------------------------------------------------

[tool.ruff]
# Match the documented runtime (Python 3.12+) and the Dockerfile base image.
target-version = "py312"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["venv", ".venv", "build", "dist"]

[tool.ruff.lint]
# A pragmatic, production-grade rule set:
#   E/W  pycodestyle, F pyflakes, I import sorting, UP pyupgrade,
#   B    bugbear, C4 comprehensions, SIM simplifications.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests favour readability over some lint conventions.
"tests/*" = ["B011"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses callables in argument defaults by design (dependency injection
# and request-parameter declarations like Query).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy — static type checking for the application package.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["app"]
warn_unused_configs = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true

# ---------------------------------------------------------------------------
# Coverage — measured over the application package only.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Fail CI if coverage regresses below this threshold (raised in M0.5).
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
