name: CI

# Gates every push and pull request on lint, formatting, type checks, and tests.
# Introduced in Milestone M0.1 — tooling & CI baseline. No application behavior
# is changed by this workflow; it only verifies the existing codebase.

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy

      - name: Pytest with coverage
        # OpenAI is mocked in tests; a dummy key satisfies settings validation
        # at import time without making any real API calls.
        env:
          OPENAI_API_KEY: "sk-test-dummy-key-for-ci"
        run: pytest --cov --cov-report=term-missing
